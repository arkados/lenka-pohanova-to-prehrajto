name: repair-sources
on:
  workflow_dispatch:
    inputs:
      limit:
        type: number
        default: 100
      runtime_minutes:
        type: number
        default: 210
  schedule:
    - cron: '27 * * * *'
permissions:
  contents: write
concurrency:
  group: lenka-source-repair
  cancel-in-progress: false
jobs:
  repair:
    if: github.event_name == 'workflow_dispatch' || vars.AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      LIMIT: ${{ inputs.limit || '100' }}
      RUNTIME_MINUTES: ${{ inputs.runtime_minutes || '210' }}
      WHISPER_CPU_THREADS: '2'
      WHISPER_NUM_WORKERS: '1'
      HF_HOME: /tmp/huggingface
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ${{ env.HF_HOME }}
          key: lenka-whisper-small-${{ runner.os }}-v1
      - name: Install source verification runtime
        run: |
          pip install '.[discovery]'
          sudo apt-get -o Acquire::Retries=2 update
          sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends ffmpeg tesseract-ocr tesseract-ocr-ces tesseract-ocr-eng
      - name: Configure repair checkpoints
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Find replacements without blocking uploads
        env:
          SDILEJ_EMAIL: ${{ secrets.SDILEJ_EMAIL }}
          SDILEJ_PASSWORD: ${{ secrets.SDILEJ_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$LIMIT" =~ ^[0-9]+$ && "$RUNTIME_MINUTES" =~ ^[0-9]+$ ]]
          (( LIMIT >= 1 && LIMIT <= 500 && RUNTIME_MINUTES >= 1 && RUNTIME_MINUTES <= 300 ))
          lenka-sync repair-sources --limit "$LIMIT" --runtime-minutes "$RUNTIME_MINUTES" --persist-git-state
      - name: Preserve repair diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lenka-source-repairs-${{ github.run_id }}
          path: |
            state/source-repairs.json
            state/source-repair-search.json
          if-no-files-found: ignore
