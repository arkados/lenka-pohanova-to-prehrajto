name: continuous-upload
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [plan, upload, continuous, subtitles, reconcile]
        default: plan
      limit:
        type: number
        default: 3
      workers:
        type: number
        default: 3
      variant:
        type: choice
        options: [all, cz, en, en_plain]
        default: all
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
concurrency:
  group: lenka-target-and-state
  cancel-in-progress: false
jobs:
  upload:
    if: github.event_name == 'workflow_dispatch' || vars.AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      MODE: ${{ inputs.mode || 'continuous' }}
      LIMIT: ${{ inputs.limit || '3' }}
      WORKERS: ${{ inputs.workers || '3' }}
      VARIANT: ${{ inputs.variant || 'all' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          pip install .
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get -o Acquire::Retries=2 update
            sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends ffmpeg
          fi
      - name: Configure checkpoints
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Verify persisted upload history
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from lenka_sync.state import audit_history

          print(json.dumps(audit_history(Path.cwd())))
          PY
      - name: Run the selected operation
        env:
          SDILEJ_EMAIL: ${{ secrets.SDILEJ_EMAIL }}
          SDILEJ_PASSWORD: ${{ secrets.SDILEJ_PASSWORD }}
          PREHRAJTO_EMAIL: ${{ secrets.PREHRAJTO_EMAIL }}
          PREHRAJTO_PASSWORD: ${{ secrets.PREHRAJTO_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$MODE" =~ ^(plan|upload|continuous|subtitles|reconcile)$ ]]
          [[ "$LIMIT" =~ ^[0-9]+$ && "$WORKERS" =~ ^[0-9]+$ ]]
          [[ "$VARIANT" =~ ^(all|cz|en|en_plain)$ ]]
          lenka-sync "$MODE" --variant "$VARIANT" --limit "$LIMIT" --workers "$WORKERS" --runtime-minutes 210 --persist-git-state
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lenka-state-${{ github.run_id }}
          path: |
            variants/*/state/
            reports/
          if-no-files-found: ignore
