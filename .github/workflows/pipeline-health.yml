name: pipeline-health

on:
  workflow_dispatch:
    inputs:
      completed_run_id:
        description: Upload run whose transfer job has already finished
        type: string
        required: false
        default: ''
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_run:
    workflows: [continuous-upload, prepare-sources, repair-sources]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: write

concurrency:
  group: lenka-pohanova-to-prehrajto-pipeline-health
  cancel-in-progress: false

jobs:
  check:
    if: vars.AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resume continuous uploads when no uploader is active
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOAD_WORKFLOW: upload.yml
          COMPLETED_RUN_ID: ${{ inputs.completed_run_id || '' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -z "$COMPLETED_RUN_ID" || "$COMPLETED_RUN_ID" =~ ^[0-9]+$ ]]
          active=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$UPLOAD_WORKFLOW" \
            --limit 30 --json databaseId,status | \
            jq --arg completed "$COMPLETED_RUN_ID" \
            '[.[] | select((.databaseId | tostring) != $completed) | select(.status == "in_progress" or .status == "queued" or .status == "pending" or .status == "waiting" or .status == "requested")] | length')
          if [[ "$active" -gt 0 ]]; then
            echo "Upload is already active or queued; no additional run needed"
            exit 0
          fi
          echo "No active upload run; resuming the continuous uploader"
          gh workflow run upload.yml --repo "$GITHUB_REPOSITORY" -f mode=continuous -f limit=3 -f workers=3 -f variant=all

      - name: Resume source producers after a missed hourly start
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cutoff=$(date -u -d '1 hour ago' +%Y-%m-%dT%H:%M:%SZ)
          for workflow in prepare.yml repair.yml; do
            runs=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" \
              --branch main --limit 30 --json status,createdAt)
            if jq -e --arg cutoff "$cutoff" \
              'any(.[]; .status != "completed" or .createdAt >= $cutoff)' <<<"$runs" >/dev/null; then
              echo "$workflow is active or started within the last hour"
              continue
            fi
            echo "$workflow missed its hourly start; resuming"
            gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref main
          done
