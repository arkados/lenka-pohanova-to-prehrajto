[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lenka-pohanova-to-prehrajto"
version = "0.1.0"
description = "Independent Czech and English series variants for the Lenka account"
requires-python = ">=3.12"
dependencies = [
  "anyascii==0.3.3",
  "pykakasi==2.3.0",
  "beautifulsoup4>=4.12",
  "requests>=2.32",
  "requests-toolbelt>=1.0",
  "urllib3>=2",
]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.11", "PyYAML>=6"]
discovery = ["faster-whisper==1.2.1", "av>=18.1,<19", "lingua-language-detector==2.2.0"]

[project.scripts]
lenka-sync = "lenka_sync.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
